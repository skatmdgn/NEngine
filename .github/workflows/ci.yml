name: NEngine CI

on:
  push:
    branches: ["main", "nengine-bootstrap"]
  pull_request:

concurrency:
  group: nengine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DNENGINE_BUILD_TESTS=ON -DNENGINE_BUILD_EDITOR=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload Windows editor
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NEngineEditor-windows-x64
          path: build/apps/editor/Release/NEngineEditor.exe
          if-no-files-found: error
