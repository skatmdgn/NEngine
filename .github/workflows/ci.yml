name: NEngine CI

on:
  push:
    branches: ["main", "nengine-bootstrap"]
  pull_request:

concurrency:
  group: nengine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install GLSL compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Compile PBR shader fixtures
        if: runner.os == 'Linux'
        run: |
          python3 tools/compile_shader.py engine/render/shaders/pbr.vert.glsl build/shaders/pbr.vert.spv
          python3 tools/compile_shader.py engine/render/shaders/pbr.frag.glsl build/shaders/pbr.frag.spv
          python3 tools/embed_spirv.py build/shaders/pbr.vert.spv --symbol pbr_vertex_words > build/shaders/pbr.vert.inc
          python3 tools/embed_spirv.py build/shaders/pbr.frag.spv --symbol pbr_fragment_words > build/shaders/pbr.frag.inc
          echo "=== NENGINE_PBR_VERTEX_SPIRV_BEGIN ==="
          cat build/shaders/pbr.vert.inc
          echo "=== NENGINE_PBR_VERTEX_SPIRV_END ==="
          echo "=== NENGINE_PBR_FRAGMENT_SPIRV_BEGIN ==="
          cat build/shaders/pbr.frag.inc
          echo "=== NENGINE_PBR_FRAGMENT_SPIRV_END ==="

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNENGINE_BUILD_TESTS=ON -DNENGINE_BUILD_EDITOR=ON -DNENGINE_BUILD_PLAYER=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Verify historical CTest suite names (GOV-004)
        run: python tools/verify_test_matrix.py --build-dir build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --output-junit release-tests.xml

      - name: Configure Debug
        run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug -DNENGINE_BUILD_TESTS=ON -DNENGINE_BUILD_EDITOR=ON -DNENGINE_BUILD_PLAYER=ON

      - name: Build Debug
        run: cmake --build build-debug --config Debug

      - name: Test Debug
        run: ctest --test-dir build-debug -C Debug --output-on-failure --output-junit debug-tests.xml

      - name: Verify Debug/Release test parity
        run: python tools/verify_build_parity.py --debug debug-tests.xml --release release-tests.xml

      - name: Verify acceptance checklist and governance regressions
        run: |
          python -m unittest discover -s tools -p "test_*.py"
          python tools/verify_checkout_provenance.py
          python tools/verify_checklist.py
          python tools/verify_third_party.py
          python tools/verify_acceptance.py

      - name: Upload Windows editor
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NEngineEditor-windows-x64
          path: build/apps/editor/Release/NEngineEditor.exe
          if-no-files-found: error

      - name: Upload Windows Player bootstrap and exporter
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NEnginePlayerBootstrap-windows-x64
          path: |
            build/apps/player/Release/NEnginePlayer.exe
            build/apps/player/Release/NEnginePlayerBuild.exe
          if-no-files-found: error
